name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate npm lockfile with Cloudflare's npm version
        run: npx --yes npm@10.9.2 install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile on main
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile"
            git push
          fi
      - name: Install exactly from the regenerated lockfile
        run: npx --yes npm@10.9.2 ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx --yes wrangler deploy --dry-run
